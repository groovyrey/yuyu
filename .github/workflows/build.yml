name: Build & Release APK

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "No signing secrets set; release will be signed with debug keys."
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK (release, arm64 only)
        run: flutter build apk --release --split-per-abi

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_clean=${VERSION%+*}" >> "$GITHUB_OUTPUT"

      - name: Name APK with app title and version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          VERSION_CLEAN=${VERSION%+*}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "build/app/outputs/flutter-apk/Yuyu-${VERSION_CLEAN}-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuyu-apk
          path: build/app/outputs/flutter-apk/Yuyu-*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Yuyu ${{ steps.version.outputs.version }}"
          tag_name: ${{ steps.version.outputs.tag }}
          body: |
            arm64 APK only (`--split-per-abi`).
          files: build/app/outputs/flutter-apk/Yuyu-${{ steps.version.outputs.version_clean }}-arm64.apk
          generate_release_notes: true
